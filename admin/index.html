<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Mycelium Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./admin.css">
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-storage-compat.js"></script>
  <script src="../local-preview.js"></script>
  <script type="module" src="./admin.js"></script>
</head>
<body>
  <main id="app" class="admin-app" aria-live="polite">
    <section class="loading-card"><span class="eyebrow">MYCELIUM RESIDENCES</span><p>Loading secure admin…</p></section>
  </main>
  <dialog id="recordDialog" class="record-dialog" aria-labelledby="recordTitle">
    <div class="dialog-top"><span class="eyebrow">SUBMISSION DETAILS</span><button class="icon-button" type="button" data-close-dialog aria-label="Close">×</button></div>
    <h2 id="recordTitle">Record</h2><dl id="recordDetails"></dl>
  </dialog>
</body>
</html>
